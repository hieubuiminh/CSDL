name: khai-tu-bang-moi-local

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: quan_li_khai_tu
      MYSQL_USER: ${MYSQL_USER:-khai_tu_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-demo_app_password_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-demo_root_password_only}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/tao_bang.sql:/docker-entrypoint-initdb.d/01-tao-bang.sql:ro
      - ../database/du_lieu_mau.sql:/docker-entrypoint-initdb.d/02-du-lieu-mau.sql:ro
      - ../database/app_setup.sql:/docker-entrypoint-initdb.d/03-tai-khoan.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h127.0.0.1 -P3306
          -u"$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --connect-timeout=3
          --batch --skip-column-names -e "SELECT 1 FROM App_User LIMIT 1" >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: khai-tu-app:bang-moi
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      # Listen on the container interface so Docker can forward the local-only host port below.
      BIND_HOST: 0.0.0.0
      NODE_ENV: production
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-khai_tu_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-demo_app_password_only}
      DB_NAME: quan_li_khai_tu
      JWT_SECRET: ${JWT_SECRET:-demo-only-secret-change-before-real-use-123456}
      ALLOW_LOCAL_PASSWORD_RESET: "true"
      ADMIN_RECOVERY_TOKEN: "${ADMIN_RECOVERY_TOKEN:-}"
    ports:
      # The application is reachable from this computer only.
      - "127.0.0.1:3001:3000"
    volumes:
      - app_config:/app/data

volumes:
  mysql_data:
  app_config:


